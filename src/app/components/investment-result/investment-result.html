<div class="result-container" *ngIf="results && results.length > 0">
  <h2>Investment Results</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Interest Gained ($)</th>
        <th>Total Savings ($)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let yearData of results">
        <td>{{ yearData.year }}</td>
        <td>{{ yearData.interest | number: '1.2-2' }}</td>
        <td>{{ yearData.endOfYear | number: '1.2-2' }}</td>
      </tr>
    </tbody>
  </table>
</div>
